
<!DOCTYPE html>
<html lang="pt-br">
<head>
        <meta charset="UTF-8">
        <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
        <title>blog</title>
        <style>
            header{
                background-color: #A80E6D;
                color:#FFFFFF;
                text-align: center;
                max-width: 800px;
                margin: 0 auto;
                padding: 16px;
                border: 5px solid #961da1;
            }
            main {
                background-color: #FFFFFF ;
                color: #A80E6D;
                max-width: 800px;
                margin: 0 auto;
                padding: 16px;
                display: flex;
            }
            img {
                width: 80px;;
                height: 80px;
            }
            .artigo-autor {
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Meu blog tech</h1>
            <p>Vou compartilhar conhecimentos sobre biologia e quimica</p>
            </header>
        <main>
            <img src="dna.jpeg" alt=" Ícone quadrado em estilo pixel art com tons de rosa sobre fundo branco. No centro, destaca-se uma cadeia de DNA diagonal. Ao redor dela, há desenhos de um microscópio, tubos de ensaio, béqueres de laboratório, uma célula, um átomo e as fórmulas químicas da água e da glicose.">
            <div>
                <h2>Meu primeiro post</h2> 
                <p class="artigo-autor">Por: Ana Eloisa</p>
                <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar informações e curiosidades sobre a biologia e quimica.</p>
                <button>❤️ <span>0</span>​</button>
                <button>👍 <span>0</span>​</button>
            </div>
 
        </main>
    </body>
    <script>
        const botoes = document.querySelectorAll("button");

        botoes.forEach( function(botao){
            botao.addEventListener("click", botaoClicado);
            function botaoClicado(){
                console.log("fui clicado");
                let texto = botao.querySelector("span");
                texto.textContent++;
            }
        })
       
        
    </script>
</html>
